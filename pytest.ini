[pytest]
python_files = test*.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = --verbose
          --disable-warnings
          --cov=src
          --cov-report=term-missing
          -m "not s3"
pythonpath = . src
markers =
    s3: tests that require real S3 connection (run with: pytest -m s3)
